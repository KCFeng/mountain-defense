<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>貓咪山脈防禦戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { touch-action: none; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        canvas { touch-action: none; }
        #side-panel { transition: transform 0.3s ease-in-out; }
        
        /* 響應式 Splash Screen 設定 */
        #splash-screen {
            background-image: url('images/splash_portrait.jpg');
            background-size: cover;
            background-position: center;
        }
        @media (min-aspect-ratio: 1/1) {
            #splash-screen {
                background-image: url('images/splash.jpg');
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white select-none">

<!-- Splash Screen -->
<div id="splash-screen" class="fixed inset-0 z-[100] transition-opacity duration-1000 flex items-center justify-center pointer-events-auto bg-gray-900">
</div>

<div id="app-wrapper" class="flex flex-col w-full h-[100dvh] overflow-hidden">
    
    <!-- 頂部狀態列 (針對手機排版優化) -->
    <div id="ui-top" class="h-14 sm:h-16 flex-none bg-gray-800 border-b border-gray-700 flex items-center justify-between px-2 sm:px-4 shadow-md z-30 relative gap-1 sm:gap-4">
        <!-- 左側：波數與計時 -->
        <div class="flex flex-col flex-shrink-0 min-w-[70px]">
            <div class="text-xs sm:text-lg font-black text-gray-200 tracking-wide">
                波數: <span id="wave-display" class="text-yellow-400 drop-shadow-md">0 / 25</span>
            </div>
            <div class="text-[10px] sm:text-sm text-gray-400 font-bold mt-0.5 sm:mt-1">
                狀態: <span id="phase-display" class="text-white">準備中</span> (<span id="timer-display" class="text-blue-300">0</span>s)
            </div>
        </div>

        <!-- 中間：怪物進度血條 -->
        <div class="flex-1 flex justify-center items-center px-1 max-w-[150px] sm:max-w-lg">
            <div class="flex items-center w-full">
                <span class="hidden sm:inline mr-3 text-sm md:text-base font-black text-gray-300 whitespace-nowrap drop-shadow">💀 怪物</span>
                <div class="relative w-full h-5 sm:h-7 bg-blue-950 border border-blue-900 rounded shadow-inner overflow-hidden">
                    <div id="monster-bar-fill" class="absolute top-0 left-0 h-full bg-red-800 transition-all duration-300 ease-out" style="width: 0%;"></div>
                    <div class="absolute inset-0 flex items-center justify-center text-[10px] sm:text-sm font-black text-white tracking-widest z-10" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">
                        <span id="monster-count-display">0</span> / 50
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：角色數、金錢與按鈕 -->
        <div class="flex items-center gap-1 sm:gap-3 flex-shrink-0">
            <div class="flex flex-col text-[10px] sm:text-sm font-bold text-right leading-tight">
                <div class="mb-0.5 text-gray-300">⚔️<span class="hidden sm:inline">角色: </span><span id="unit-count-display" class="text-blue-400">0</span><span class="hidden sm:inline"> / 23</span></div>
                <div class="text-gray-300">💰<span class="hidden sm:inline">金幣: </span><span id="gold-display" class="text-yellow-400">500</span></div>
            </div>
            <!-- 移除按鈕背景與邊框，僅保留圖示與 hover 效果 -->
            <button onclick="toggleSettingsModal()" class="flex items-center justify-center text-lg sm:text-2xl hover:opacity-75 transition-opacity active:scale-95" title="設定">⚙️</button>
            <button onclick="takeScreenshot()" class="flex items-center justify-center text-lg sm:text-2xl hover:opacity-75 transition-opacity active:scale-95" title="截圖">🖼️</button>
        </div>
    </div>

    <!-- 遊戲主體區塊 -->
    <div class="flex flex-1 flex-col md:flex-row overflow-hidden relative">
        <div id="canvas-container" class="flex-1 relative w-full h-full touch-none bg-gray-900">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            
            <div id="spawn-notice-container" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center opacity-0 scale-75 transition-all duration-500 pointer-events-none z-50 w-full">
                <img id="spawn-notice-img" src="" alt="Spawn" class="w-[480px] h-[480px] object-contain filter drop-shadow-[0_0_50px_rgba(255,255,255,0.6)] mb-8">
                <div class="bg-gray-900 bg-opacity-90 rounded-full px-16 py-6 shadow-[0_0_40px_rgba(0,0,0,0.8)] flex items-center border-2 border-gray-600">
                    <span id="spawn-notice-name" class="text-6xl font-black tracking-widest">角色名稱</span>
                    <span class="text-6xl font-black text-white ml-6 tracking-widest">出陣！</span>
                </div>
            </div>

            <div id="boss-warning-container" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center opacity-0 scale-75 transition-all duration-500 pointer-events-none z-50 w-full">
                <img id="boss-warning-img" src="" alt="Boss" class="w-[480px] h-[480px] object-contain filter drop-shadow-[0_0_50px_rgba(239,68,68,0.8)] mb-8">
                <div class="bg-gray-900 bg-opacity-90 rounded-full px-16 py-6 shadow-[0_0_40px_rgba(239,68,68,0.8)] flex items-center border-2 border-red-600">
                    <span id="boss-warning-name" class="text-6xl font-black text-red-500 tracking-widest drop-shadow-[0_0_20px_rgba(239,68,68,0.9)]">BOSS名稱</span>
                    <span class="text-6xl font-black text-white ml-6 tracking-widest">來襲！</span>
                </div>
            </div>
            
            <div id="floating-menu" class="absolute hidden z-10 pointer-events-none" style="width: 0; height: 0;">
                <button id="btn-sell" onclick="deleteUnit()" class="absolute -top-12 -left-16 bg-red-600 hover:bg-red-500 text-white px-2 rounded-full shadow-lg pointer-events-auto transform transition active:scale-90 flex items-center justify-center min-w-[3.5rem] h-10 text-xs font-bold whitespace-nowrap">
                    售
                </button>
                <button id="btn-merge" onclick="mergeUnits()" class="absolute -top-12 -right-16 bg-purple-600 hover:bg-purple-500 text-white px-2 rounded-full shadow-lg pointer-events-auto transform transition active:scale-90 flex items-center justify-center min-w-[2.5rem] h-10 text-xs font-bold whitespace-nowrap">
                    合
                </button>
            </div>
        </div>

        <!-- 側邊/下方 資訊面板 -->
        <div id="side-panel" class="flex-none w-full md:w-64 h-[160px] sm:h-48 md:h-full bg-gray-800 border-t md:border-t-0 md:border-l border-gray-700 flex flex-row md:flex-col transition-all duration-300 z-20 shadow-[-5px_0_15px_rgba(0,0,0,0.5)]">
            
            <!-- Logo 區塊 (僅在橫屏/中大螢幕顯示) -->
            <div class="hidden md:flex flex-none w-full p-4 items-center justify-center border-b border-gray-700 bg-gray-900 shadow-inner">
                <img src="images/logo.png" alt="貓咪山脈防禦戰" class="w-full max-w-[200px] object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">
            </div>

            <div class="flex-1 relative overflow-hidden">
                <div id="side-empty" class="absolute inset-0 flex items-center justify-center text-gray-400 font-bold text-sm md:text-lg">
                    請點選陣地角色
                </div>
                <div id="side-content" class="hidden absolute inset-0 flex-col p-2 md:p-4 overflow-y-auto bg-gray-800">
                    <div class="hidden md:flex flex-none h-32 bg-gray-900 rounded-lg mb-4 p-2 items-center justify-center border-2 border-dashed border-gray-700 relative overflow-hidden">
                        <div id="char-preview-visual" class="w-full h-full rounded-md shadow-inner"></div>
                    </div>
                    <div class="flex-1 flex flex-col justify-start">
                        <h2 id="info-name" class="text-base md:text-2xl font-black mb-1 md:mb-2 text-center md:text-left drop-shadow-sm tracking-wide">-</h2>
                        <div class="grid grid-cols-2 gap-1 md:gap-2 text-[10px] md:text-sm mb-2 md:mb-3">
                            <div class="bg-gray-700 p-1 md:p-2 rounded text-center shadow-inner"><span class="block text-gray-400">數量</span><span id="info-count" class="font-bold text-white">0</span></div>
                            <div class="bg-gray-700 p-1 md:p-2 rounded text-center shadow-inner"><span class="block text-gray-400">總攻擊力</span><span id="info-damage" class="font-bold text-red-400 drop-shadow">0</span></div>
                            <div class="bg-gray-700 p-1 md:p-2 rounded text-center shadow-inner"><span class="block text-gray-400">攻速/射程</span><span id="info-speed-range" class="font-bold text-blue-300">0s / 0</span></div>
                            <div class="bg-gray-700 p-1 md:p-2 rounded text-center shadow-inner relative overflow-hidden"><span class="block text-gray-400">MP</span><span id="info-mp" class="font-bold text-indigo-300">0 / 0</span><div class="absolute inset-0 bg-indigo-500 opacity-10"></div></div>
                        </div>
                        <div id="info-buff-container" class="bg-gray-800 border border-emerald-800 rounded p-1 md:p-2 text-[10px] md:text-xs hidden flex-col gap-1 mb-2 md:mb-3 shadow-md"></div>
                        <div id="info-skill-container" class="bg-gray-900 rounded-lg p-2 md:p-3 text-[10px] md:text-xs hidden flex flex-col gap-2 md:gap-3 shadow-inner border border-gray-700"></div>
                    </div>
                </div>
            </div>
            
            <div class="flex-none p-2 md:p-6 flex flex-col items-center justify-center gap-3 md:gap-8 border-l md:border-l-0 md:border-t border-gray-700 bg-gray-900 md:bg-gray-800 w-24 md:w-auto relative">
                <!-- 覆蓋在按鈕上的防誤觸透明層 -->
                <div id="summon-overlay" class="absolute inset-0 z-10 hidden"></div>
                <button id="btn-start" onclick="showDifficultyMenu()" class="w-14 h-14 md:w-28 md:h-28 rounded-full bg-emerald-700 hover:bg-emerald-600 text-white font-black shadow-[0_0_15px_rgba(4,120,87,0.6)] transition-all active:scale-90 flex items-center justify-center border-[3px] md:border-4 border-emerald-400 text-[11px] md:text-2xl leading-tight">開始<br>戰鬥</button>

                </button>
            </div>
        </div>
    </div>
</div>

<!-- 設定選單遮罩 -->
<div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center backdrop-blur-sm">
    <div class="bg-gray-800 border border-gray-600 p-8 rounded-xl text-left shadow-[0_0_50px_rgba(0,0,0,1)] max-w-sm w-full mx-4 transform transition-all scale-100">
        <h2 class="text-2xl font-black mb-6 text-white border-b-2 border-gray-600 pb-3 tracking-widest text-center">遊戲設定</h2>
        <div class="space-y-6">
            <label class="flex items-center cursor-pointer">
                <input type="checkbox" id="setting-skill-chat" class="form-checkbox h-6 w-6 text-blue-500 rounded border-gray-500 bg-gray-700 focus:ring-blue-500 focus:ring-offset-gray-800">
                <span class="ml-3 text-white text-lg font-bold">顯示技能對話框特效</span>
            </label>
            <label class="flex items-center cursor-pointer">
                <input type="checkbox" id="setting-idle-chat" class="form-checkbox h-6 w-6 text-blue-500 rounded border-gray-500 bg-gray-700 focus:ring-blue-500 focus:ring-offset-gray-800">
                <span class="ml-3 text-white text-lg font-bold">顯示角色閒置對話框</span>
            </label>
        </div>
        <button onclick="toggleSettingsModal()" class="mt-8 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg shadow-lg transition-transform active:scale-95 text-lg">確定</button>
    </div>
</div>

<!-- 難度選單遮罩 -->
<div id="difficulty-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center backdrop-blur-sm">
    <div class="bg-gray-800 border border-gray-600 p-8 rounded-xl text-center shadow-[0_0_50px_rgba(0,0,0,1)] max-w-sm w-full mx-4">
        <h2 class="text-3xl font-black mb-6 text-white border-b-2 border-gray-600 pb-3 tracking-widest">選擇難度</h2>
        <div class="space-y-4">
            <button onclick="startGame('EASY')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-lg shadow-lg transition-transform active:scale-95 text-lg">簡單 (30隻/波, Boss x1)</button>
            <button onclick="startGame('NORMAL')" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-4 rounded-lg shadow-lg transition-transform active:scale-95 text-lg">中等 (40隻/波, Boss x2)</button>
            <button onclick="startGame('HARD')" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-lg shadow-lg transition-transform active:scale-95 text-lg">困難 (50隻/波, Boss x3)</button>
        </div>
        <button onclick="hideDifficultyMenu()" class="mt-8 text-gray-400 hover:text-white underline text-sm transition-colors">先返回佈陣</button>
    </div>
</div>

<div id="game-over-modal" class="fixed inset-0 bg-black bg-opacity-95 z-50 hidden flex items-center justify-center flex-col backdrop-blur-md">
    <h1 id="game-over-title" class="text-5xl md:text-7xl font-black mb-6 tracking-widest drop-shadow-[0_0_20px_rgba(255,0,0,0.8)]">任務結束</h1>
    <p id="game-over-desc" class="text-xl md:text-2xl text-gray-300 mb-10 font-bold">...</p>
    <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white font-black py-4 px-10 rounded-full shadow-[0_0_30px_rgba(37,99,235,0.8)] text-2xl transition-transform active:scale-90 border-2 border-blue-400">重新開始</button>
</div>

<script>
window.addEventListener('load', () => {
    setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.classList.add('opacity-0');
        setTimeout(() => {
            splash.style.display = 'none';
        }, 1000); 
    }, 1000); 
});

function toggleSettingsModal() {
    const modal = document.getElementById('settings-modal');
    if (modal.classList.contains('hidden')) {
        modal.classList.remove('hidden');
        document.getElementById('setting-skill-chat').checked = gameState.showSkillChat;
        document.getElementById('setting-idle-chat').checked = gameState.showIdleChat;
    } else {
        modal.classList.add('hidden');
        gameState.showSkillChat = document.getElementById('setting-skill-chat').checked;
        gameState.showIdleChat = document.getElementById('setting-idle-chat').checked;
    }
}

function takeScreenshot() {
    const target = document.getElementById('app-wrapper');
    if (!target) return;
    
    html2canvas(target, {
        useCORS: true,
        backgroundColor: '#111827'
    }).then(canvas => {
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'cat_mountain_defense.png';
        link.href = dataURL;
        link.click();
    }).catch(err => {
        alert('截圖失敗！若您直接以 file:// 開啟檔案，瀏覽器安全機制會阻擋截圖。建議使用 Local Server 運行。');
        console.error(err);
    });
}

function resizeAndLayout() {
    const container = document.getElementById('canvas-container');
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;

    const cols = 7, rows = 4, padding = 30; 
    const availableWidth = Math.max(10, canvas.width - padding * 2); 
    const availableHeight = Math.max(10, canvas.height - padding * 2);
    
    const maxCellWidth = availableWidth / (cols + 2);
    const maxCellHeight = availableHeight / (rows + 2);
    
    const cellSize = Math.max(30, Math.floor(Math.min(maxCellWidth, maxCellHeight)));
    gameScale = cellSize / 60; 

    const deployWidth = cols * cellSize;
    const deployHeight = rows * cellSize;
    const deployX = (canvas.width - deployWidth) / 2;
    const deployY = (canvas.height - deployHeight) / 2;

    const pathMargin = cellSize * 0.8;
    pathRect = {
        x: deployX - pathMargin, y: deployY - pathMargin,
        w: deployWidth + pathMargin * 2, h: deployHeight + pathMargin * 2
    };

    let gridIndex = 0;
    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
            if (!grids[gridIndex]) grids[gridIndex] = { units: [] };
            grids[gridIndex].x = deployX + col * cellSize;
            grids[gridIndex].y = deployY + row * cellSize;
            grids[gridIndex].size = cellSize;
            gridIndex++;
        }
    }
    updateFloatingMenuPosition();
}
window.addEventListener('resize', resizeAndLayout);

function handleInteraction(e) {
    if(e.type === 'touchstart') e.preventDefault();
    if (gameState.isGameOver || gameState.phase === 'MENU') return;

    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } 
    else { clientX = e.clientX; clientY = e.clientY; }

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;

    let clickedGrid = grids.find(g => x >= g.x && x <= g.x + g.size && y >= g.y && y <= g.y + g.size);

    if (clickedGrid) {
        if (selectedGrid && selectedGrid !== clickedGrid && selectedGrid.units.length > 0) {
            let movingCharName = selectedGrid.units[0].charName;
            let targetCharName = clickedGrid.units.length > 0 ? clickedGrid.units[0].charName : null;
            let movingData = CHARACTERS[movingCharName];

            if (clickedGrid.units.length === 0) {
                clickedGrid.units = [...selectedGrid.units];
                selectedGrid.units = [];
                selectedGrid = null; 
            } else if (targetCharName === movingCharName && clickedGrid.units.length + selectedGrid.units.length <= movingData.maxStack) {
                clickedGrid.units.push(...selectedGrid.units);
                selectedGrid.units = [];
                selectedGrid = null;
            } else {
                selectedGrid = clickedGrid; 
            }
        } else if (clickedGrid.units.length > 0) {
            selectedGrid = clickedGrid;
        } else {
            selectedGrid = null;
        }
    } else {
        selectedGrid = null;
    }
    updateSidePanel();
}
canvas.addEventListener('mousedown', handleInteraction);
canvas.addEventListener('touchstart', handleInteraction, {passive: false});

let isSummoning = false;
function summonUnit() {
    if (isSummoning || gameState.gold < 50 || gameState.isGameOver || getTotalUnits() >= 23) return;
    
    isSummoning = true;
    document.getElementById('summon-overlay').classList.remove('hidden');

    let newLevel = getRandomLevel();
    let newCharName = getRandomCharacterByLevel(newLevel);
    let charData = CHARACTERS[newCharName];

    let targetGrid = grids.find(g => g.units.length > 0 && g.units[0].charName === newCharName && g.units.length < charData.maxStack);
    
    if (!targetGrid) {
        let emptyGrids = grids.filter(g => g.units.length === 0);
        if (emptyGrids.length > 0) {
            targetGrid = emptyGrids[Math.floor(Math.random() * emptyGrids.length)];
        }
    }

    if (targetGrid) {
        gameState.gold -= 50;
        targetGrid.units.push(createUnitInstance(newCharName));
        
        floatingTexts.push(new FloatingText(
            targetGrid.x + targetGrid.size / 2, 
            targetGrid.y + targetGrid.size / 2 - 20 * gameScale, 
            "召喚", 
            RARITY_COLORS[newLevel]
        ));

        if (newLevel >= 4) {
            showSpawnNotice(newCharName, newLevel);
        }
        
        if(selectedGrid === targetGrid) updateSidePanel();
        updateUI();
    }

    setTimeout(() => {
        isSummoning = false;
        document.getElementById('summon-overlay').classList.add('hidden');
    }, 250);
}

function deleteUnit() {
    if (!selectedGrid || selectedGrid.units.length === 0) return;
    let charName = selectedGrid.units[0].charName;
    let charData = CHARACTERS[charName];
    if (charData.level >= 4) return;

    gameState.gold += charData.sellPrice;
    selectedGrid.units.pop(); 
    if (selectedGrid.units.length === 0) selectedGrid = null; 
    
    updateSidePanel();
    updateUI();
}

function mergeUnits() {
    if (!selectedGrid || selectedGrid.units.length < 3) return;
    let charName = selectedGrid.units[0].charName;
    let charData = CHARACTERS[charName];
    let nextLevel = null;
    let roll = Math.random() * 100;

    if (charData.level === 1) { 
        if (roll < 1) nextLevel = 5; else if (roll < 5) nextLevel = 4; else if (roll < 20) nextLevel = 3; else if (roll < 50) nextLevel = 2; else nextLevel = 1;
    } else if (charData.level === 2) { 
        if (roll < 5) nextLevel = 5; else if (roll < 20) nextLevel = 4; else if (roll < 50) nextLevel = 3; else nextLevel = 2;
    } else if (charData.level === 3) { 
        if (roll < 20) nextLevel = 5; else if (roll < 50) nextLevel = 4; else nextLevel = 3;
    } else return; 

    let nextCharName = getRandomCharacterByLevel(nextLevel);
    selectedGrid.units = [createUnitInstance(nextCharName)];
    
    if (nextLevel >= 4) {
        showSpawnNotice(nextCharName, nextLevel);
    }
    
    updateSidePanel();
}

function showDifficultyMenu() { document.getElementById('difficulty-modal').classList.remove('hidden'); }

function startGame(diff) {
    hideDifficultyMenu();
    document.getElementById('btn-start').style.display = 'none';
    gameState.difficulty = diff;
    if (diff === 'EASY') gameState.baseEnemyCount = 30;
    else if (diff === 'NORMAL') gameState.baseEnemyCount = 40;
    else if (diff === 'HARD') gameState.baseEnemyCount = 50;
    gameState.wave = 0;
    startPhase('COOLDOWN'); 
}

function startPhase(newPhase) {
    gameState.phase = newPhase;
    if (newPhase === 'ATTACK') {
        gameState.wave++;
        gameState.phaseTimer = 30;
        gameState.enemiesSpawnedThisWave = 0;
        gameState.spawnCooldown = 0; 
        
        if (gameState.wave % 5 === 0) {
            let bossName = Object.keys(MONSTERS).find(name => MONSTERS[name].tier === 'BOSS' && MONSTERS[name].waves.includes(gameState.wave));
            if (bossName) {
                showBossWarning(bossName);
            }
        }
    } else if (newPhase === 'COOLDOWN') {
        gameState.phaseTimer = 5; 
    }
    updateUI();
}

class Enemy {
    constructor(monsterName) {
        const data = MONSTERS[monsterName];
        this.name = monsterName;
        this.tier = data.tier;
        this.isBoss = (this.tier === 'BOSS');
        this.baseSpeed = data.speed; 
        
        let difficultyMultiplier = 1.0;
        if (gameState.difficulty === 'NORMAL') difficultyMultiplier = 2.0;
        if (gameState.difficulty === 'HARD') difficultyMultiplier = 4.0;
        
        let waveMultiplier = 1.0;
        if (this.isBoss) {
            let normalWaveIndex = (gameState.wave / 5) - 1;
            waveMultiplier = Math.pow(1.1, normalWaveIndex);
        } else {
            let normalWaveIndex = gameState.wave - Math.floor(gameState.wave / 5);
            waveMultiplier = Math.pow(1.1, normalWaveIndex - 1);
        }

        this.maxHp = data.hp * difficultyMultiplier * waveMultiplier;
        this.hp = this.maxHp;
        
        let speedMultiplier = 1.0;
        if (gameState.difficulty === 'NORMAL') speedMultiplier = 1.5;
        if (gameState.difficulty === 'HARD') speedMultiplier = 2.0;

        this.speed = data.speed * speedMultiplier; 
        this.reward = this.isBoss ? 100 : 5;
        
        const TIER_SCALE = { '低': 1.0, '中': 1.5, '高': 2.0, 'BOSS': 3.0 };
        const TIER_COLOR = { '低': '#22c55e', '中': '#3b82f6', '高': '#a855f7', 'BOSS': '#ef4444' };
        
        let baseSize = 10;
        this.size = baseSize * TIER_SCALE[this.tier] * gameScale; 
        this.color = data.color || TIER_COLOR[this.tier];
        this.scaleMultiplier = TIER_SCALE[this.tier]; 
        
        this.x = pathRect.x;
        this.y = pathRect.y;
        this.waypointIndex = 1; 

        this.stunTimer = 0;
        this.slowTimer = 0;
        this.weakTimer = 0;
    }

    update(dt) {
        if (this.stunTimer > 0) this.stunTimer -= dt;
        if (this.slowTimer > 0) this.slowTimer -= dt;
        if (this.weakTimer > 0) this.weakTimer -= dt;

        if (this.stunTimer > 0) return; 

        const waypoints = [
            { x: pathRect.x, y: pathRect.y }, { x: pathRect.x + pathRect.w, y: pathRect.y },
            { x: pathRect.x + pathRect.w, y: pathRect.y + pathRect.h }, { x: pathRect.x, y: pathRect.y + pathRect.h }
        ];
        const target = waypoints[this.waypointIndex];
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const dist = Math.hypot(dx, dy);
        
        let currentSpeed = this.speed;
        if (this.slowTimer > 0) currentSpeed = currentSpeed / 2;

        const moveDist = currentSpeed * gameScale * dt;

        if (dist <= moveDist) {
            this.x = target.x; this.y = target.y;
            this.waypointIndex = (this.waypointIndex + 1) % 4;
        } else {
            this.x += (dx / dist) * moveDist; this.y += (dy / dist) * moveDist;
        }
    }

    takeDamage(amount) {
        let actualDamage = amount;
        if (this.weakTimer > 0) actualDamage *= 2; 
        this.hp -= actualDamage;
    }

    draw(ctx) {
        let img = monsterImages[this.name];
        let isImageLoaded = img && img.complete && img.naturalWidth > 0;
        
        let drawH = this.size * 2; 
        let yOffsetForText = this.size; 

        if (isImageLoaded) {
            let aspect = img.naturalWidth / img.naturalHeight;
            let drawW = drawH * aspect;
            yOffsetForText = drawH / 2;
            
            ctx.save();
            ctx.beginPath();
            let shadowW = drawW * 0.4;
            let shadowH = drawW * 0.15;
            ctx.ellipse(this.x, this.y + drawH * 0.4, shadowW, shadowH, 0, 0, Math.PI * 2);
            ctx.fillStyle = this.stunTimer > 0 ? '#fbbf24' : '#000000'; 
            ctx.globalAlpha = 0.5;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            
            if(this.stunTimer > 0) ctx.globalAlpha = 0.7;
            if(this.weakTimer > 0) { ctx.filter = 'sepia(1) hue-rotate(250deg) saturate(3)'; } 
            if(this.slowTimer > 0) { ctx.filter = 'sepia(1) hue-rotate(180deg) saturate(2)'; } 
            
            ctx.translate(this.x, this.y);
            ctx.rotate(gameState.stepAngle);
            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();
            
        } else {
            ctx.fillStyle = this.stunTimer > 0 ? '#fbbf24' : this.color; 
            ctx.beginPath();
            let safeRadius = Math.max(1, this.size);
            ctx.arc(this.x, this.y, safeRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        }

        if (this.isBoss) {
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${14 * gameScale}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(this.name, this.x, this.y - yOffsetForText - 18 * gameScale);
        }

        let statusYOffset = this.y - yOffsetForText - (this.isBoss ? 35 * gameScale : 14 * gameScale);
        ctx.font = `bold ${10 * gameScale}px Arial`;
        ctx.textAlign = 'center';
        
        if (this.stunTimer > 0) {
            ctx.fillStyle = '#fbbf24'; ctx.fillText('STUN', this.x, statusYOffset); statusYOffset -= 12 * gameScale;
        }
        if (this.slowTimer > 0) {
            ctx.fillStyle = '#67e8f9'; ctx.fillText('SLOW', this.x, statusYOffset); statusYOffset -= 12 * gameScale;
        }
        if (this.weakTimer > 0) {
            ctx.fillStyle = '#c084fc'; ctx.fillText('WEAK', this.x, statusYOffset);
        }

        if (this.hp > 0) {
            let barW = 20 * gameScale * this.scaleMultiplier; 
            let barH = 4 * gameScale;
            let barY = this.y - yOffsetForText - 10 * gameScale;
            
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(this.x - barW/2, barY, barW, barH);
            ctx.fillStyle = '#22c55e';
            let hpWidth = barW * (this.hp / this.maxHp);
            ctx.fillRect(this.x - barW/2, barY, Math.max(0, hpWidth), barH);
        }
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y - 10 * gameScale; 
        this.text = text;
        this.color = color;
        this.lifetime = 1.0; 
        this.maxLifetime = 1.0;
        this.velocityY = -20 * gameScale; 
    }

    update(dt) {
        this.lifetime -= dt;
        this.y += this.velocityY * dt;
    }

    draw(ctx) {
        if (this.lifetime <= 0) return;
        
        const alpha = Math.max(0, this.lifetime / this.maxLifetime);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = this.color;
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 2 * gameScale;
        ctx.font = `bold ${12 * gameScale}px Arial`;
        ctx.textAlign = 'center';
        ctx.strokeText(this.text, this.x, this.y);
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

function endGame(isWin) {
    gameState.isGameOver = true;
    const modal = document.getElementById('game-over-modal');
    modal.classList.remove('hidden');
    document.getElementById('game-over-title').innerText = isWin ? '任務成功！' : '任務失敗！';
    document.getElementById('game-over-title').classList.add(isWin ? 'text-yellow-400' : 'text-red-500');
    document.getElementById('game-over-desc').innerText = isWin ? '您成功守護了貓咪山脈！' : '怪物數量失控，防線崩潰！';
}

function drawSpeechBubble(ctx, x, y, width, currentTimer, maxTimer, text, color) {
    const alpha = currentTimer / maxTimer; 
    
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y - width / 1.5); 
    
    ctx.font = `${8 * gameScale}px sans-serif`;
    const textWidth = ctx.measureText(text).width;
    const padding = 4 * gameScale; 
    const boxW = textWidth + padding * 2;
    const boxH = 14 * gameScale; 
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1 * gameScale;
    ctx.beginPath();
    ctx.roundRect(-boxW/2, -boxH, boxW, boxH, 2 * gameScale);
    
    ctx.moveTo(-3 * gameScale, 0);
    ctx.lineTo(0, 4 * gameScale);
    ctx.lineTo(3 * gameScale, 0);
    
    ctx.fill();
    ctx.stroke();
    
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 0, -boxH/2 + 1*gameScale);
    
    ctx.restore();
}

function gameLoop(timestamp) {
    if (!gameState.lastTime) gameState.lastTime = timestamp;
    const dt = (timestamp - gameState.lastTime) / 1000;
    gameState.lastTime = timestamp;

    gameState.stepAngle = Math.sin(timestamp / 500 * Math.PI) * 2 * (Math.PI / 180);

    if (!gameState.isGameOver) {
        if (enemies.length > 50) endGame(false);

        if (gameState.phase !== 'MENU') {
            gameState.mpRegenTimer += dt;
            if (gameState.mpRegenTimer >= 1.0) {
                grids.forEach(g => {
                    g.units.forEach(u => {
                        let max = CHARACTERS[u.charName].maxMP;
                        let regenAmount = 1; 
                        if (u.mpRegenBuffTimer && u.mpRegenBuffTimer > 0) {
                            regenAmount = 3;
                            u.mpRegenBuffTimer -= 1.0; 
                        }
                        if (u.mp < max) u.mp = Math.min(max, u.mp + regenAmount);
                    });
                });
                gameState.mpRegenTimer = 0;
                if (selectedGrid) updateSidePanel(); 
            }

            gameState.passiveIncomeTimer += dt;
            if (gameState.passiveIncomeTimer >= 5) {
                gameState.gold += 5; gameState.passiveIncomeTimer = 0; updateUI();
            }

            gameState.phaseTimer -= dt;

            if (gameState.phase === 'ATTACK') {
                const isBossWave = (gameState.wave % 5 === 0);
                let actualBossCount = 0;
                if (isBossWave) {
                    if (gameState.difficulty === 'EASY') actualBossCount = 1;
                    else if (gameState.difficulty === 'NORMAL') actualBossCount = 2;
                    else if (gameState.difficulty === 'HARD') actualBossCount = 3;
                }

                let availableMonsters = Object.keys(MONSTERS).filter(name => MONSTERS[name].waves.includes(gameState.wave));

                gameState.spawnCooldown -= dt;
                if (gameState.spawnCooldown <= 0 && availableMonsters.length > 0) {
                    let randomMonsterName = availableMonsters[Math.floor(Math.random() * availableMonsters.length)];
                    
                    if (isBossWave && gameState.enemiesSpawnedThisWave < actualBossCount) {
                        enemies.push(new Enemy(randomMonsterName)); 
                        gameState.enemiesSpawnedThisWave++;
                        let remainingTime = Math.max(0.1, 15 - (30 - gameState.phaseTimer));
                        let avgWait = remainingTime / (actualBossCount - gameState.enemiesSpawnedThisWave + 1);
                        gameState.spawnCooldown = Math.random() * (avgWait * 2);
                    } else if (!isBossWave && gameState.enemiesSpawnedThisWave < gameState.baseEnemyCount) {
                        enemies.push(new Enemy(randomMonsterName)); 
                        gameState.enemiesSpawnedThisWave++;
                        let baseWait = Math.random() < 0.3 ? (Math.random() * 0.3 + 0.1) : (Math.random() * 1.5 + 1.0);
                        let scale = 20 / gameState.baseEnemyCount;
                        gameState.spawnCooldown = baseWait * scale;
                    }
                }
            }

            if (gameState.phaseTimer <= 0) {
                if (gameState.phase === 'ATTACK') {
                    if (gameState.wave >= 25) endGame(true); else startPhase('COOLDOWN');
                } else startPhase('ATTACK');
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].update(dt);
            if (enemies[i].hp <= 0) {
                gameState.gold += enemies[i].reward;
                enemies.splice(i, 1); updateUI();
            }
        }

        grids.forEach(grid => {
            if (grid.units.length > 0) {
                let charName = grid.units[0].charName;
                let charData = CHARACTERS[charName];
                let cx = grid.x + grid.size / 2;
                let cy = grid.y + grid.size / 2;
                
                let actualRange = charData.range * gameScale; 

                grid.units.forEach(unit => {
                    if (unit.castTimer > 0) unit.castTimer = Math.max(0, unit.castTimer - dt);
                    if (unit.idleCastTimer > 0) unit.idleCastTimer = Math.max(0, unit.idleCastTimer - dt);
                    
                    unit.idleTimer += dt;
                    if (unit.idleTimer >= unit.idleTriggerTime && unit.castTimer === 0) {
                        unit.idleText = IDLE_TEXTS[Math.floor(Math.random() * IDLE_TEXTS.length)];
                        unit.idleCastTimer = 1.5; 
                        unit.idleTimer = 0;
                        unit.idleTriggerTime = 8 + Math.random() * 4; 
                    }
                    
                    unit.cooldown -= dt;
                    if (unit.cooldown <= 0) {
                        let canCastSkills = charData.skills.filter(s => unit.mp >= SKILLS[s].costMP);
                        let skillFired = false;

                        if (canCastSkills.length > 0) {
                            let selectedSkillName = canCastSkills[Math.floor(Math.random() * canCastSkills.length)];
                            let skill = SKILLS[selectedSkillName];
                            
                            let target = null;
                            let aoeTargets = [];

                            if (skill.type === 'BUFF') {
                                aoeTargets = grids.filter(g => g.units.length > 0 && Math.hypot((g.x + g.size/2) - cx, (g.y + g.size/2) - cy) <= actualRange)
                                                  .flatMap(g => g.units);
                                if(aoeTargets.length > 0) target = aoeTargets[0]; 
                            } else {
                                target = enemies.find(e => Math.hypot(e.x - cx, e.y - cy) <= actualRange);
                                if (target && skill.targetType === 'AOE') {
                                    aoeTargets = enemies.filter(e => Math.hypot(e.x - cx, e.y - cy) <= actualRange);
                                }
                            }

                            if (target) {
                                skillFired = true;
                                unit.mp -= skill.costMP;
                                unit.castTimer = 0.6; 
                                unit.castSkillName = selectedSkillName;
                                unit.idleTimer = 0;
                                unit.idleTriggerTime = 8 + Math.random() * 4;
                                if(selectedGrid === grid) updateSidePanel();

                                if (skill.type === 'BUFF') {
                                    if(Math.random() <= skill.rate) {
                                        aoeTargets.forEach(u => u.mpRegenBuffTimer = skill.duration);
                                    }
                                } else if (selectedSkillName === '三重矢') {
                                    for(let t=0; t<3; t++){
                                        setTimeout(() => {
                                            if (enemies.includes(target) && target.hp > 0) {
                                                projectiles.push({
                                                    x: cx, y: cy, tx: target.x, ty: target.y,
                                                    speed: 600, color: skill.color, damage: charData.damage, 
                                                    target: target, isSkill: true, skillData: skill
                                                });
                                            }
                                        }, t * 100); 
                                    }
                                } else if (skill.targetType === 'SINGLE') {
                                    projectiles.push({
                                        x: cx, y: cy, tx: target.x, ty: target.y,
                                        speed: 500, color: skill.color, damage: skill.magicDamage,
                                        target: target, isSkill: true, skillData: skill
                                    });
                                } else if (skill.targetType === 'AOE') {
                                    aoeTargets.forEach(t => {
                                        projectiles.push({
                                            x: cx, y: cy, tx: t.x, ty: t.y,
                                            speed: 500, color: skill.color, damage: skill.magicDamage,
                                            target: t, isSkill: true, skillData: skill
                                        });
                                    });
                                }
                                unit.cooldown = charData.cd;
                            }
                        }

                        if (!skillFired && enemies.length > 0) {
                            let target = enemies.find(e => Math.hypot(e.x - cx, e.y - cy) <= actualRange);
                            if (target) {
                                unit.idleTimer = 0;
                                unit.idleTriggerTime = 8 + Math.random() * 4;
                                projectiles.push({
                                    x: cx, y: cy, tx: target.x, ty: target.y,
                                    speed: 400, color: RARITY_COLORS[charData.level], damage: charData.damage, target: target, isSkill: false
                                });
                                unit.cooldown = charData.cd; 
                            }
                        }
                    }
                });
            }
        });

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            let dx = p.target.x - p.x;
            let dy = p.target.y - p.y;
            let dist = Math.hypot(dx, dy);
            
            if (!enemies.includes(p.target) || p.target.hp <= 0) {
                projectiles.splice(i, 1); continue;
            }

            let actualSpeed = p.speed * gameScale;

            if (dist < actualSpeed * dt) {
                p.target.takeDamage(p.damage); 
                
                if (p.isSkill) {
                    if (Math.random() <= p.skillData.rate) {
                        if (p.skillData.type === 'DEBUFF') {
                            if (p.skillData.effect === 'STUN') {
                                p.target.stunTimer = Math.max(p.target.stunTimer, p.skillData.duration);
                            } else if (p.skillData.effect === 'SLOW') {
                                p.target.slowTimer = Math.max(p.target.slowTimer, p.skillData.duration);
                            } else if (p.skillData.effect === 'WEAK') {
                                p.target.weakTimer = Math.max(p.target.weakTimer, p.skillData.duration);
                            }
                        }
                    } else {
                        if(p.skillData.type === 'DEBUFF') { 
                            floatingTexts.push(new FloatingText(p.target.x, p.target.y, "MISS", "#f87171"));
                        }
                    }
                }
                projectiles.splice(i, 1);
            } else {
                p.x += (dx / dist) * actualSpeed * dt;
                p.y += (dy / dist) * actualSpeed * dt;
            }
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            floatingTexts[i].update(dt);
            if (floatingTexts[i].lifetime <= 0) {
                floatingTexts.splice(i, 1);
            }
        }
        
        if(gameState.phase !== 'MENU') updateUI();
    }

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (bgImage.complete && bgImage.naturalWidth > 0 && grids.length > 0) {
        let bgExpand = grids[0].size * 1.5;
        let drawBgX = pathRect.x - bgExpand;
        let drawBgY = pathRect.y - bgExpand;
        let drawBgW = pathRect.w + bgExpand * 2;
        let drawBgH = pathRect.h + bgExpand * 2;
        ctx.drawImage(bgImage, drawBgX, drawBgY, drawBgW, drawBgH);
    } else {
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(pathRect.x, pathRect.y, pathRect.w, pathRect.h);
    }

    let deployW = Math.max(0, 7 * (grids[0]?.size || 0)); 
    let deployH = Math.max(0, 4 * (grids[0]?.size || 0));
    if(grids.length > 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; 
        ctx.fillRect(grids[0].x, grids[0].y, deployW, deployH);
    }

    if (enemies.length >= 40 && !gameState.isGameOver) {
        const alpha = (Math.sin(timestamp / 200) + 1) / 4 + 0.1; 
        ctx.strokeStyle = `rgba(239, 68, 68, ${alpha})`; ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
    }

    grids.forEach(grid => {
        if (selectedGrid) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; 
            ctx.lineWidth = 1; 
            ctx.strokeRect(grid.x, grid.y, grid.size, grid.size);
        }

        if (grid === selectedGrid) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.fillRect(grid.x, grid.y, grid.size, grid.size);
            if (grid.units.length > 0) {
                let r = CHARACTERS[grid.units[0].charName].range * gameScale;
                ctx.beginPath(); ctx.arc(grid.x + grid.size/2, grid.y + grid.size/2, r, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.stroke();
            }
        }

        if (grid.units.length > 0) {
            let charData = CHARACTERS[grid.units[0].charName];
            let count = grid.units.length;
            let cx = grid.x + grid.size / 2;
            let cy = grid.y + grid.size / 2;
            let color = RARITY_COLORS[charData.level];
            let img = charImages[grid.units[0].charName];
            
            let isImageLoaded = img && img.complete && img.naturalWidth > 0;
            let isSingleMax = charData.maxStack === 1;
            let baseDrawH = isSingleMax ? (grid.size * 0.95) : (grid.size * 0.65); 

            let yOffset = grid.size * 0.15;
            let xOffset = grid.size * 0.22;

            let positions = [];
            if (count === 1) {
                positions.push({x: cx, y: cy, u: grid.units[0]});
            } else if (count === 2) {
                positions.push({x: cx - xOffset, y: cy, u: grid.units[0]});
                positions.push({x: cx + xOffset, y: cy, u: grid.units[1]});
            } else if (count >= 3) {
                positions.push({x: cx, y: cy - yOffset, u: grid.units[0]}); 
                positions.push({x: cx - xOffset, y: cy + yOffset, u: grid.units[1]}); 
                positions.push({x: cx + xOffset, y: cy + yOffset, u: grid.units[2]}); 
            }

            positions.forEach(pos => {
                let u = pos.u;
                let isCasting = u.castTimer && u.castTimer > 0;
                let isIdleCasting = u.idleCastTimer && u.idleCastTimer > 0;
                let drawH = baseDrawH;
                
                let magicColor = '#ffffff';
                if (isCasting && SKILLS[u.castSkillName]) {
                     magicColor = SKILLS[u.castSkillName].color;
                }
                
                if (isImageLoaded) {
                    let aspect = img.naturalWidth / img.naturalHeight;
                    let drawW = drawH * aspect;
                    
                    ctx.save();
                    if (isCasting) {
                        let alpha = u.castTimer / 0.6; 
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(timestamp / 600); 
                        ctx.globalAlpha = alpha;
                        ctx.strokeStyle = magicColor;
                        ctx.lineWidth = 2 * gameScale;
                        ctx.shadowColor = magicColor;
                        ctx.shadowBlur = 10 * gameScale;
                        
                        let r = isSingleMax ? grid.size * 0.55 : grid.size * 0.35;
                        
                        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, Math.PI * 2); ctx.stroke();
                        
                        let pOrder = [0, 2, 4, 1, 3, 0];
                        ctx.beginPath();
                        pOrder.forEach((idx, step) => {
                            let angle = (idx * 2 * Math.PI / 5) - Math.PI / 2;
                            let px = Math.cos(angle) * r * 0.8;
                            let py = Math.sin(angle) * r * 0.8;
                            if (step === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        });
                        ctx.stroke();
                        ctx.restore();
                    }
                    
                    ctx.translate(pos.x, pos.y);
                    if (!isCasting) {
                        ctx.rotate(gameState.stepAngle); 
                    }
                    
                    ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
                    ctx.restore();
                    
                    if (gameState.showSkillChat && isCasting && u.castSkillName) {
                        drawSpeechBubble(ctx, pos.x, pos.y, drawW, u.castTimer, 0.6, u.castSkillName + "！", magicColor);
                    } else if (gameState.showIdleChat && isIdleCasting) {
                        drawSpeechBubble(ctx, pos.x, pos.y, drawW, u.idleCastTimer, 1.5, u.idleText, '#d1d5db'); 
                    }
                    
                } else {
                    let dotRadius = Math.max(6, grid.size * 0.16);
                    
                    if (isCasting) {
                        let alpha = u.castTimer / 0.6;
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(timestamp / 600);
                        ctx.globalAlpha = alpha;
                        ctx.strokeStyle = magicColor;
                        ctx.lineWidth = 2 * gameScale;
                        
                        let r = isSingleMax ? grid.size * 0.55 : grid.size * 0.35;
                        
                        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, Math.PI * 2); ctx.stroke(); 
                        
                        let pOrder = [0, 2, 4, 1, 3, 0];
                        ctx.beginPath();
                        pOrder.forEach((idx, step) => {
                            let angle = (idx * 2 * Math.PI / 5) - Math.PI / 2;
                            let px = Math.cos(angle) * r * 0.8;
                            let py = Math.sin(angle) * r * 0.8;
                            if (step === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        });
                        ctx.stroke();
                        ctx.restore();
                    }

                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, dotRadius, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#374151'; 
                    ctx.stroke();
                    
                    if (gameState.showSkillChat && isCasting && u.castSkillName) {
                        drawSpeechBubble(ctx, pos.x, pos.y, dotRadius * 2, u.castTimer, 0.6, u.castSkillName + "！", magicColor);
                    } else if (gameState.showIdleChat && isIdleCasting) {
                        drawSpeechBubble(ctx, pos.x, pos.y, dotRadius * 2, u.idleCastTimer, 1.5, u.idleText, '#d1d5db');
                    }
                }
            });
        }
    });

    enemies.forEach(e => e.draw(ctx));
    
    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        let pRadius = p.isSkill ? 6 : 4;
        ctx.arc(p.x, p.y, pRadius, 0, Math.PI * 2);
        ctx.fill();
        if(p.isSkill) {
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
        }
    });

    floatingTexts.forEach(ft => ft.draw(ctx));

    requestAnimationFrame(gameLoop);
}

resizeAndLayout();
updateSidePanel();
window.onload = function() {
    requestAnimationFrame(gameLoop);
};
</script>
