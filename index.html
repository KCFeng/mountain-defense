<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中央山脈防禦</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { touch-action: none; overflow: hidden; }
        canvas { touch-action: none; }
        #side-panel { transition: transform 0.3s ease-in-out; }
        
        /* 整合新背景圖片 */
        #canvas-container {
            background-image: url('images/bg.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-900 text-white select-none">

<div id="app-wrapper" class="flex flex-col w-full h-screen overflow-hidden">
    <div id="ui-top" class="h-16 flex-none bg-gray-800 border-b border-gray-700 flex items-center justify-between px-2 sm:px-4">
        <!-- 左側：波數與計時 -->
        <div class="flex flex-col">
            <div class="text-sm sm:text-base font-bold text-gray-200">
                波數: <span id="wave-display" class="text-yellow-300">0 / 25</span>
            </div>
            <div class="text-xs sm:text-sm text-gray-400">
                狀態: <span id="phase-display" class="text-white">準備中</span> (<span id="timer-display">0</span>s)
            </div>
        </div>

        <!-- 中間：主要按鈕 -->
        <div class="flex space-x-2">
            <button id="btn-start" onclick="showDifficultyMenu()" class="bg-green-600 hover:bg-green-500 text-white font-bold py-1 px-3 sm:py-2 sm:px-4 rounded text-xs sm:text-sm shadow-lg transition-transform active:scale-95">
                開始戰鬥
            </button>
            <button id="btn-summon" onclick="summonUnit()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1 px-3 sm:py-2 sm:px-4 rounded text-xs sm:text-sm shadow-lg transition-transform active:scale-95">
                召喚 (50G)
            </button>
        </div>

        <!-- 右側：角色數、金錢與怪物數 -->
        <div class="flex flex-col sm:flex-row sm:space-x-4 text-xs sm:text-sm font-bold text-right sm:text-left">
            <div>⚔️ 角色: <span id="unit-count-display" class="text-blue-400">0</span> / 23</div>
            <div>💰 金幣: <span id="gold-display" class="text-yellow-400">500</span></div>
            <div>💀 怪物: <span id="monster-count-display" class="text-red-400">0</span> / 50</div>
        </div>
    </div>

    <!-- 遊戲主體區塊 -->
    <div class="flex flex-1 flex-col md:flex-row overflow-hidden relative">
        <div id="canvas-container" class="flex-1 relative w-full h-full touch-none">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>
            
            <!-- 誇張放大版出陣提示 -->
            <div id="spawn-notice-container" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center opacity-0 scale-75 transition-all duration-500 pointer-events-none z-50 w-full">
                <!-- 5倍大的角色圖片 -->
                <img id="spawn-notice-img" src="" alt="Spawn" class="w-[480px] h-[480px] object-contain filter drop-shadow-[0_0_50px_rgba(255,255,255,0.6)] mb-8">
                
                <!-- 文字橫幅區塊 -->
                <div class="bg-gray-900 bg-opacity-90 rounded-full px-16 py-6 shadow-[0_0_40px_rgba(0,0,0,0.8)] flex items-center border-2 border-gray-600">
                    <span id="spawn-notice-name" class="text-6xl font-black tracking-widest">角色名稱</span>
                    <span class="text-6xl font-black text-white ml-6 tracking-widest">出陣！</span>
                </div>
            </div>

            <!-- BOSS 來襲提示 -->
            <div id="boss-warning-container" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center opacity-0 scale-75 transition-all duration-500 pointer-events-none z-50 w-full">
                <!-- 5倍大的BOSS圖片 -->
                <img id="boss-warning-img" src="" alt="Boss" class="w-[480px] h-[480px] object-contain filter drop-shadow-[0_0_50px_rgba(239,68,68,0.8)] mb-8">
                
                <!-- 警告文字橫幅區塊 -->
                <div class="bg-gray-900 bg-opacity-90 rounded-full px-16 py-6 shadow-[0_0_40px_rgba(239,68,68,0.8)] flex items-center border-2 border-red-600">
                    <span id="boss-warning-name" class="text-6xl font-black text-red-500 tracking-widest drop-shadow-[0_0_20px_rgba(239,68,68,0.9)]">BOSS名稱</span>
                    <span class="text-6xl font-black text-white ml-6 tracking-widest">來襲！</span>
                </div>
            </div>
            
            <!-- 環繞式操作按鈕 -->
            <div id="floating-menu" class="absolute hidden z-10 pointer-events-none" style="width: 0; height: 0;">
                <button id="btn-sell" onclick="deleteUnit()" class="absolute -top-12 -left-16 bg-red-600 hover:bg-red-500 text-white px-2 rounded-full shadow-lg pointer-events-auto transform transition active:scale-90 flex items-center justify-center min-w-[3.5rem] h-10 text-xs font-bold whitespace-nowrap">
                    售
                </button>
                <button id="btn-merge" onclick="mergeUnits()" class="absolute -top-12 -right-16 bg-purple-600 hover:bg-purple-500 text-white px-2 rounded-full shadow-lg pointer-events-auto transform transition active:scale-90 flex items-center justify-center min-w-[2.5rem] h-10 text-xs font-bold whitespace-nowrap">
                    合
                </button>
            </div>
        </div>

        <div id="side-panel" class="flex-none w-full h-32 md:w-64 md:h-full bg-gray-800 border-t md:border-t-0 md:border-l border-gray-700 flex flex-col transition-all duration-300 relative z-20">
            <!-- 未選取時顯示 -->
            <div id="side-empty" class="flex-1 flex items-center justify-center text-gray-500 text-sm md:text-base">
                請點選角色
            </div>
            
            <!-- 選取時顯示 -->
            <div id="side-content" class="hidden flex-col h-full p-2 md:p-4 overflow-y-auto">
                <div class="hidden md:flex flex-none h-32 bg-gray-900 rounded-lg mb-4 p-2 items-center justify-center border-2 border-dashed border-gray-700 relative overflow-hidden">
                    <div id="char-preview-visual" class="w-full h-full rounded-md shadow-inner"></div>
                </div>
                
                <div class="flex-1 flex flex-col justify-start">
                    <h2 id="info-name" class="text-lg md:text-xl font-bold mb-1 text-center md:text-left">-</h2>
                    
                    <div class="grid grid-cols-2 gap-1 md:gap-2 text-xs md:text-sm mb-2">
                        <div class="bg-gray-700 p-1 md:p-2 rounded text-center">
                            <span class="block text-gray-400 text-[10px] md:text-xs">數量</span>
                            <span id="info-count" class="font-bold">0</span>
                        </div>
                        <div class="bg-gray-700 p-1 md:p-2 rounded text-center">
                            <span class="block text-gray-400 text-[10px] md:text-xs">總攻擊力</span>
                            <span id="info-damage" class="font-bold text-red-400">0</span>
                        </div>
                        <div class="bg-gray-700 p-1 md:p-2 rounded text-center">
                            <span class="block text-gray-400 text-[10px] md:text-xs">攻速/射程</span>
                            <span id="info-speed-range" class="font-bold text-blue-400">0s / 0</span>
                        </div>
                        <div class="bg-gray-700 p-1 md:p-2 rounded text-center">
                            <span class="block text-gray-400 text-[10px] md:text-xs">MP</span>
                            <span id="info-mp" class="font-bold text-indigo-400">0 / 0</span>
                        </div>
                    </div>
                    
                    <!-- 技能說明區 -->
                    <div id="info-skill-container" class="bg-gray-900 rounded p-2 text-xs hidden">
                        <div class="font-bold text-yellow-300 mb-1" id="info-skill-name">技能名稱</div>
                        <div class="text-gray-300" id="info-skill-desc">技能效果說明...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 難度選單遮罩 -->
<div id="difficulty-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center">
    <div class="bg-gray-800 border border-gray-600 p-6 rounded-lg text-center shadow-2xl max-w-sm w-full mx-4">
        <h2 class="text-2xl font-bold mb-6 text-white border-b border-gray-600 pb-2">選擇難度</h2>
        <div class="space-y-4">
            <button onclick="startGame('EASY')" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded shadow transition">簡單 (30隻/波, Boss x1)</button>
            <button onclick="startGame('NORMAL')" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 rounded shadow transition">中等 (40隻/波, Boss x2)</button>
            <button onclick="startGame('HARD')" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded shadow transition">困難 (50隻/波, Boss x3)</button>
        </div>
        <button onclick="hideDifficultyMenu()" class="mt-6 text-gray-400 hover:text-white underline text-sm">先返回佈陣</button>
    </div>
</div>

<div id="game-over-modal" class="fixed inset-0 bg-black bg-opacity-90 z-50 hidden flex items-center justify-center flex-col">
    <h1 id="game-over-title" class="text-4xl md:text-6xl font-bold mb-4">任務結束</h1>
    <p id="game-over-desc" class="text-lg md:text-xl text-gray-300 mb-8">...</p>
    <button onclick="location.reload()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded shadow-lg text-lg">重新開始</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const RARITY_COLORS = {
    1: '#ffffff', // 白
    2: '#60a5fa', // 藍
    3: '#f87171', // 紅
    4: '#c084fc', // 紫
    5: '#fbbf24'  // 金
};

const SKILLS = {
    '光箭': { type: 'ATTACK', costMP: 5, magicDamage: 15, targetType: 'SINGLE', rate: 1.0, duration: 0, desc: '射出一道魔法光箭攻擊單體敵人。', color: '#fef08a' },
    '衝擊之暈(lv1)': { type: 'DEBUFF', costMP: 10, magicDamage: 0, targetType: 'SINGLE', rate: 0.10, duration: 1, desc: '發出劍氣將單體敵人擊暈 (10%機率)。', color: '#93c5fd' },
    '衝擊之暈(lv2)': { type: 'DEBUFF', costMP: 10, magicDamage: 0, targetType: 'SINGLE', rate: 0.20, duration: 2, desc: '發出劍氣將單體敵人擊暈 (20%機率)。', color: '#60a5fa' },
    '衝擊之暈(lv3)': { type: 'DEBUFF', costMP: 10, magicDamage: 0, targetType: 'SINGLE', rate: 0.30, duration: 3, desc: '發出劍氣將單體敵人擊暈 (30%機率)。', color: '#3b82f6' },
    '衝擊之暈(max)': { type: 'DEBUFF', costMP: 10, magicDamage: 0, targetType: 'AOE', rate: 0.40, duration: 4, desc: '發出劍氣將射程內群體敵人擊暈 (40%機率)。', color: '#1d4ed8' },
};

const CHARACTERS = {
    '銀光騎士': { level: 1, maxMP: 0, damage: 10, range: 100, cd: 1.2, maxStack: 3, sellPrice: 5, skills: [] },
    '銀光法師': { level: 1, maxMP: 50, damage: 5, range: 100, cd: 1.2, maxStack: 3, sellPrice: 5, skills: ['光箭'] },
    '海音騎士': { level: 2, maxMP: 25, damage: 25, range: 110, cd: 1.0, maxStack: 3, sellPrice: 10, skills: ['衝擊之暈(lv1)'] },
    '甘特': { level: 3, maxMP: 50, damage: 70, range: 120, cd: 0.8, maxStack: 3, sellPrice: 25, skills: ['衝擊之暈(lv2)'] },
    '幻影騎士': { level: 4, maxMP: 75, damage: 250, range: 130, cd: 0.6, maxStack: 1, sellPrice: 0, skills: ['衝擊之暈(lv3)'] },
    '神話暗黑騎士': { level: 5, maxMP: 100, damage: 500, range: 150, cd: 0.4, maxStack: 1, sellPrice: 0, skills: ['衝擊之暈(max)'] }
};

// 依據最新需求更新 BOSS 血量
const MONSTERS = {
    '食人妖精': { tier: '低', speed: 60, hp: 40, waves: [1,2,3,4,6,7,8,9], color: '#4ade80' },
    '侏儒': { tier: '低', speed: 90, hp: 24, waves: [1,2,3,4,6,7,8,9], color: '#22c55e' },
    '石頭高崙': { tier: '中', speed: 50, hp: 120, waves: [6,7,8,9,11,12,13,14,16,17,18,19], color: '#93c5fd' },
    '瘋狗': { tier: '中', speed: 80, hp: 64, waves: [6,7,8,9,11,12,13,14,16,17,18,19], color: '#60a5fa' },
    '食人妖精王': { tier: '中', speed: 60, hp: 80, waves: [6,7,8,9,11,12,13,14,16,17,18,19], color: '#3b82f6' },
    '妖魔騎兵': { tier: '高', speed: 80, hp: 150, waves: [16,17,18,19,21,22,23,24], color: '#c084fc' },
    '妖魔斧兵': { tier: '高', speed: 60, hp: 150, waves: [16,17,18,19,21,22,23,24], color: '#a855f7' },
    '瑪依奴': { tier: '高', speed: 60, hp: 150, waves: [16,17,18,19,21,22,23,24], color: '#9333ea' },
    '覺醒炎魔': { tier: 'BOSS', speed: 40, hp: 3000, waves: [5], color: '#ef4444' },
    '變型怪': { tier: 'BOSS', speed: 60, hp: 3500, waves: [10], color: '#dc2626' },
    '白金巴風特': { tier: 'BOSS', speed: 70, hp: 4000, waves: [15], color: '#b91c1c' },
    '白金死亡騎士': { tier: 'BOSS', speed: 80, hp: 5000, waves: [20], color: '#991b1b' },
    '支配者吉爾塔斯': { tier: 'BOSS', speed: 90, hp: 6000, waves: [25], color: '#7f1d1d' },
};

// 載入角色圖片資源
const charImages = {};
for (const name in CHARACTERS) {
    const img = new Image();
    img.src = `images/${name}.png`;
    charImages[name] = img;
}

// 載入怪物圖片資源
const monsterImages = {};
for (const name in MONSTERS) {
    const img = new Image();
    img.src = `images/${name}.png`;
    monsterImages[name] = img;
}

const POOL_BY_LEVEL = { 1: [], 2: [], 3: [], 4: [], 5: [] };
for (const [name, data] of Object.entries(CHARACTERS)) {
    POOL_BY_LEVEL[data.level].push(name);
}

const gameState = {
    gold: 500, wave: 0, phase: 'MENU', phaseTimer: 0, isGameOver: false,
    difficulty: null, baseEnemyCount: 0, enemiesSpawnedThisWave: 0, spawnCooldown: 0,
    lastTime: 0, passiveIncomeTimer: 0, mpRegenTimer: 0, stepAngle: 0
};

let grids = [];
let enemies = [];
let projectiles = [];
let pathRect = { x: 0, y: 0, w: 0, h: 0 };
let selectedGrid = null;
let gameScale = 1; // 全域縮放比例

function resizeAndLayout() {
    const container = document.getElementById('canvas-container');
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;

    const cols = 7, rows = 4, padding = 30; 
    const availableWidth = Math.max(10, canvas.width - padding * 2); 
    const availableHeight = Math.max(10, canvas.height - padding * 2);
    
    // 取消 60px 限制，讓地圖能完全佔滿畫面可用空間
    const maxCellWidth = availableWidth / (cols + 2);
    const maxCellHeight = availableHeight / (rows + 2);
    
    const cellSize = Math.max(30, Math.floor(Math.min(maxCellWidth, maxCellHeight)));
    gameScale = cellSize / 60; // 基準網格大小為 60

    const deployWidth = cols * cellSize;
    const deployHeight = rows * cellSize;
    const deployX = (canvas.width - deployWidth) / 2;
    const deployY = (canvas.height - deployHeight) / 2;

    const pathMargin = cellSize * 0.8;
    pathRect = {
        x: deployX - pathMargin, y: deployY - pathMargin,
        w: deployWidth + pathMargin * 2, h: deployHeight + pathMargin * 2
    };

    let gridIndex = 0;
    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
            if (!grids[gridIndex]) grids[gridIndex] = { units: [] };
            grids[gridIndex].x = deployX + col * cellSize;
            grids[gridIndex].y = deployY + row * cellSize;
            grids[gridIndex].size = cellSize;
            gridIndex++;
        }
    }
    updateFloatingMenuPosition();
}
window.addEventListener('resize', resizeAndLayout);

function getTotalUnits() { return grids.reduce((total, g) => total + g.units.length, 0); }

function updateUI() {
    document.getElementById('gold-display').innerText = gameState.gold;
    document.getElementById('wave-display').innerText = `${gameState.wave} / 25`;
    document.getElementById('phase-display').innerText = gameState.phase === 'ATTACK' ? '戰鬥中' : (gameState.phase === 'COOLDOWN' ? '冷卻中' : '準備中');
    document.getElementById('timer-display').innerText = Math.ceil(gameState.phaseTimer);
    document.getElementById('monster-count-display').innerText = enemies.length;
    
    let currentUnits = getTotalUnits();
    const unitCountDisplay = document.getElementById('unit-count-display');
    if (unitCountDisplay) unitCountDisplay.innerText = currentUnits;

    const btnSummon = document.getElementById('btn-summon');
    if (currentUnits >= 23) {
        btnSummon.classList.add('opacity-50', 'pointer-events-none');
        btnSummon.innerText = '已達上限';
    } else {
        btnSummon.classList.remove('opacity-50', 'pointer-events-none');
        btnSummon.innerText = '召喚 (50G)';
    }
}

function updateFloatingMenuPosition() {
    const menu = document.getElementById('floating-menu');
    const btnSell = document.getElementById('btn-sell');
    const btnMerge = document.getElementById('btn-merge');

    if (selectedGrid && selectedGrid.units.length > 0) {
        menu.classList.remove('hidden');
        menu.style.left = `${selectedGrid.x + selectedGrid.size / 2}px`;
        menu.style.top = `${selectedGrid.y + selectedGrid.size / 2}px`;

        let charName = selectedGrid.units[0].charName;
        let charData = CHARACTERS[charName];
        let count = selectedGrid.units.length;

        if (charData.level >= 4) {
            btnSell.style.display = 'none';
            btnMerge.style.display = 'none';
        } else {
            btnSell.style.display = 'flex';
            btnMerge.style.display = 'flex';
            btnSell.innerText = `售(+${charData.sellPrice}G)`;
            if (count >= 3) btnMerge.classList.remove('opacity-50', 'pointer-events-none');
            else btnMerge.classList.add('opacity-50', 'pointer-events-none');
        }
    } else {
        menu.classList.add('hidden');
    }
}

function updateSidePanel() {
    const sideEmpty = document.getElementById('side-empty');
    const sideContent = document.getElementById('side-content');
    const visual = document.getElementById('char-preview-visual');
    const skillContainer = document.getElementById('info-skill-container');

    if (selectedGrid && selectedGrid.units.length > 0) {
        sideEmpty.classList.add('hidden');
        sideContent.classList.remove('hidden');
        sideContent.classList.add('flex');

        let charName = selectedGrid.units[0].charName;
        let charData = CHARACTERS[charName];
        let count = selectedGrid.units.length;
        let color = RARITY_COLORS[charData.level];

        document.getElementById('info-name').innerText = charName;
        document.getElementById('info-name').style.color = color;
        document.getElementById('info-count').innerText = `${count} / ${charData.maxStack}`;
        document.getElementById('info-damage').innerText = `${charData.damage * count}`;
        document.getElementById('info-speed-range').innerText = `${charData.cd}s / ${charData.range}`;
        document.getElementById('info-mp').innerText = `${Math.floor(selectedGrid.units[0].mp)} / ${charData.maxMP}`;

        // 資訊面板完整方框顯示，取消圓形裁切與強制填滿
        visual.style.backgroundColor = 'transparent'; 
        visual.style.boxShadow = `none`;
        visual.style.backgroundImage = `url('images/${charName}.png')`;
        visual.style.backgroundSize = 'contain'; 
        visual.style.backgroundRepeat = 'no-repeat';
        visual.style.backgroundPosition = 'center';

        if (charData.skills.length > 0) {
            let skill = SKILLS[charData.skills[0]];
            skillContainer.classList.remove('hidden');
            document.getElementById('info-skill-name').innerText = `[${skill.type}] ${charData.skills[0]} (耗MP:${skill.costMP})`;
            document.getElementById('info-skill-desc').innerText = skill.desc;
        } else {
            skillContainer.classList.add('hidden');
        }
    } else {
        sideEmpty.classList.remove('hidden');
        sideContent.classList.add('hidden');
        sideContent.classList.remove('flex');
    }
    updateFloatingMenuPosition();
}

let spawnNoticeTimer = null;
function showSpawnNotice(charName, level) {
    const container = document.getElementById('spawn-notice-container');
    const img = document.getElementById('spawn-notice-img');
    const nameSpan = document.getElementById('spawn-notice-name');
    
    img.src = `images/${charName}.png`;
    nameSpan.innerText = charName;
    
    if (level === 4) nameSpan.className = 'text-purple-400 drop-shadow-[0_0_20px_rgba(168,85,247,0.9)] text-6xl font-black tracking-widest';
    else if (level === 5) nameSpan.className = 'text-yellow-400 drop-shadow-[0_0_20px_rgba(234,179,8,0.9)] text-6xl font-black tracking-widest';
    else nameSpan.className = 'text-white text-6xl font-black tracking-widest';

    container.classList.remove('opacity-0', 'scale-75');
    container.classList.add('opacity-100', 'scale-100');

    if (spawnNoticeTimer) clearTimeout(spawnNoticeTimer);
    spawnNoticeTimer = setTimeout(() => {
        container.classList.remove('opacity-100', 'scale-100');
        container.classList.add('opacity-0', 'scale-75');
    }, 2500);
}

let bossWarningTimer = null;
function showBossWarning(bossName) {
    const container = document.getElementById('boss-warning-container');
    const img = document.getElementById('boss-warning-img');
    const nameSpan = document.getElementById('boss-warning-name');
    
    img.src = `images/${bossName}.png`;
    nameSpan.innerText = bossName;
    
    container.classList.remove('opacity-0', 'scale-75');
    container.classList.add('opacity-100', 'scale-100');

    if (bossWarningTimer) clearTimeout(bossWarningTimer);
    bossWarningTimer = setTimeout(() => {
        container.classList.remove('opacity-100', 'scale-100');
        container.classList.add('opacity-0', 'scale-75');
    }, 3000);
}

function handleInteraction(e) {
    if(e.type === 'touchstart') e.preventDefault();
    if (gameState.isGameOver || gameState.phase === 'MENU') return;

    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } 
    else { clientX = e.clientX; clientY = e.clientY; }

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (clientX - rect.left) * scaleX;
    const y = (clientY - rect.top) * scaleY;

    let clickedGrid = grids.find(g => x >= g.x && x <= g.x + g.size && y >= g.y && y <= g.y + g.size);

    if (clickedGrid) {
        if (selectedGrid && selectedGrid !== clickedGrid && selectedGrid.units.length > 0) {
            let movingCharName = selectedGrid.units[0].charName;
            let targetCharName = clickedGrid.units.length > 0 ? clickedGrid.units[0].charName : null;
            let movingData = CHARACTERS[movingCharName];

            if (clickedGrid.units.length === 0) {
                clickedGrid.units = [...selectedGrid.units];
                selectedGrid.units = [];
                selectedGrid = null; 
            } else if (targetCharName === movingCharName && clickedGrid.units.length + selectedGrid.units.length <= movingData.maxStack) {
                clickedGrid.units.push(...selectedGrid.units);
                selectedGrid.units = [];
                selectedGrid = null;
            } else {
                selectedGrid = clickedGrid; 
            }
        } else if (clickedGrid.units.length > 0) {
            selectedGrid = clickedGrid;
        } else {
            selectedGrid = null;
        }
    } else {
        selectedGrid = null;
    }
    updateSidePanel();
}
canvas.addEventListener('mousedown', handleInteraction);
canvas.addEventListener('touchstart', handleInteraction, {passive: false});

function getRandomLevel() {
    const r = Math.random() * 100;
    if (r < 1) return 5;
    if (r < 5) return 4;
    if (r < 20) return 3;
    if (r < 50) return 2;
    return 1;
}

function getRandomCharacterByLevel(level) {
    const pool = POOL_BY_LEVEL[level];
    return pool[Math.floor(Math.random() * pool.length)];
}

function createUnitInstance(charName) {
    return {
        charName: charName,
        cooldown: 0,
        mp: CHARACTERS[charName].maxMP,
        castTimer: 0 // 新增施法時間屬性
    };
}

function summonUnit() {
    if (gameState.gold < 50 || gameState.isGameOver || getTotalUnits() >= 23) return;
    
    let newLevel = getRandomLevel();
    let newCharName = getRandomCharacterByLevel(newLevel);
    let charData = CHARACTERS[newCharName];

    let targetGrid = grids.find(g => g.units.length > 0 && g.units[0].charName === newCharName && g.units.length < charData.maxStack);
    
    if (!targetGrid) {
        let emptyGrids = grids.filter(g => g.units.length === 0);
        if (emptyGrids.length === 0) return; 
        targetGrid = emptyGrids[Math.floor(Math.random() * emptyGrids.length)];
    }

    gameState.gold -= 50;
    targetGrid.units.push(createUnitInstance(newCharName));
    
    // 觸發出陣提示 (僅限傳說與神話階級)
    if (newLevel >= 4) {
        showSpawnNotice(newCharName, newLevel);
    }
    
    if(selectedGrid === targetGrid) updateSidePanel();
    updateUI();
}

function deleteUnit() {
    if (!selectedGrid || selectedGrid.units.length === 0) return;
    let charName = selectedGrid.units[0].charName;
    let charData = CHARACTERS[charName];
    if (charData.level >= 4) return;

    gameState.gold += charData.sellPrice;
    selectedGrid.units.pop(); 
    if (selectedGrid.units.length === 0) selectedGrid = null; 
    
    updateSidePanel();
    updateUI();
}

function mergeUnits() {
    if (!selectedGrid || selectedGrid.units.length < 3) return;
    let charName = selectedGrid.units[0].charName;
    let charData = CHARACTERS[charName];
    let nextLevel = null;
    let roll = Math.random() * 100;

    if (charData.level === 1) { 
        if (roll < 1) nextLevel = 5; else if (roll < 5) nextLevel = 4; else if (roll < 20) nextLevel = 3; else if (roll < 50) nextLevel = 2; else nextLevel = 1;
    } else if (charData.level === 2) { 
        if (roll < 5) nextLevel = 5; else if (roll < 20) nextLevel = 4; else if (roll < 50) nextLevel = 3; else nextLevel = 2;
    } else if (charData.level === 3) { 
        if (roll < 20) nextLevel = 5; else if (roll < 50) nextLevel = 4; else nextLevel = 3;
    } else return; 

    let nextCharName = getRandomCharacterByLevel(nextLevel);
    selectedGrid.units = [createUnitInstance(nextCharName)];
    
    // 觸發出陣提示 (僅限傳說與神話階級)
    if (nextLevel >= 4) {
        showSpawnNotice(nextCharName, nextLevel);
    }
    
    updateSidePanel();
}

function showDifficultyMenu() { document.getElementById('difficulty-modal').classList.remove('hidden'); }
function hideDifficultyMenu() { document.getElementById('difficulty-modal').classList.add('hidden'); }

function startGame(diff) {
    hideDifficultyMenu();
    document.getElementById('btn-start').style.display = 'none';
    gameState.difficulty = diff;
    if (diff === 'EASY') gameState.baseEnemyCount = 30;
    else if (diff === 'NORMAL') gameState.baseEnemyCount = 40;
    else if (diff === 'HARD') gameState.baseEnemyCount = 50;
    gameState.wave = 0;
    startPhase('COOLDOWN'); 
}

function startPhase(newPhase) {
    gameState.phase = newPhase;
    if (newPhase === 'ATTACK') {
        gameState.wave++;
        gameState.phaseTimer = 30;
        gameState.enemiesSpawnedThisWave = 0;
        gameState.spawnCooldown = 0; 
        
        // 檢查是否為 BOSS 波次，觸發來襲動畫
        if (gameState.wave % 5 === 0) {
            let bossName = Object.keys(MONSTERS).find(name => MONSTERS[name].tier === 'BOSS' && MONSTERS[name].waves.includes(gameState.wave));
            if (bossName) {
                showBossWarning(bossName);
            }
        }
    } else if (newPhase === 'COOLDOWN') {
        gameState.phaseTimer = 5; 
    }
    updateUI();
}

class Enemy {
    constructor(monsterName) {
        const data = MONSTERS[monsterName];
        this.name = monsterName;
        this.tier = data.tier;
        this.isBoss = (this.tier === 'BOSS');
        
        // 難度倍率影響血量
        let difficultyMultiplier = 1.0;
        if (gameState.difficulty === 'NORMAL') difficultyMultiplier = 2.0;
        if (gameState.difficulty === 'HARD') difficultyMultiplier = 4.0;
        
        // 依據關卡類別計算 10% 成長倍率 (1.1 倍的 N 次方)
        let waveMultiplier = 1.0;
        if (this.isBoss) {
            let normalWaveIndex = (gameState.wave / 5) - 1;
            waveMultiplier = Math.pow(1.1, normalWaveIndex);
        } else {
            let normalWaveIndex = gameState.wave - Math.floor(gameState.wave / 5);
            waveMultiplier = Math.pow(1.1, normalWaveIndex - 1);
        }

        this.maxHp = data.hp * difficultyMultiplier * waveMultiplier;
        this.hp = this.maxHp;
        
        // 移速受難度影響
        let speedMultiplier = 1.0;
        if (gameState.difficulty === 'NORMAL') speedMultiplier = 1.5;
        if (gameState.difficulty === 'HARD') speedMultiplier = 2.0;

        this.speed = data.speed * speedMultiplier; 
        this.reward = this.isBoss ? 100 : 5;
        
        // 依據怪物能力表階級進行對應比例放大：低->100%；中->150%；高->200%；BOSS->300%
        const TIER_SCALE = { '低': 1.0, '中': 1.5, '高': 2.0, 'BOSS': 3.0 };
        const TIER_COLOR = { '低': '#22c55e', '中': '#3b82f6', '高': '#a855f7', 'BOSS': '#ef4444' };
        
        let baseSize = 10;
        this.size = baseSize * TIER_SCALE[this.tier] * gameScale; 
        this.color = data.color || TIER_COLOR[this.tier];
        this.scaleMultiplier = TIER_SCALE[this.tier]; // 儲存倍率供圖片繪製使用
        
        this.x = pathRect.x;
        this.y = pathRect.y;
        this.waypointIndex = 1; 

        this.stunTimer = 0;
    }

    update(dt) {
        if (this.stunTimer > 0) {
            this.stunTimer -= dt;
            return; 
        }

        const waypoints = [
            { x: pathRect.x, y: pathRect.y }, { x: pathRect.x + pathRect.w, y: pathRect.y },
            { x: pathRect.x + pathRect.w, y: pathRect.y + pathRect.h }, { x: pathRect.x, y: pathRect.y + pathRect.h }
        ];
        const target = waypoints[this.waypointIndex];
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const dist = Math.hypot(dx, dy);
        
        const moveDist = this.speed * gameScale * dt;

        if (dist <= moveDist) {
            this.x = target.x; this.y = target.y;
            this.waypointIndex = (this.waypointIndex + 1) % 4;
        } else {
            this.x += (dx / dist) * moveDist; this.y += (dy / dist) * moveDist;
        }
    }

    draw(ctx) {
        let img = monsterImages[this.name];
        let isImageLoaded = img && img.complete && img.naturalWidth > 0;
        
        let drawH = this.size * 2; // 圖片預設高度等於直徑
        let yOffsetForText = this.size; // 文字位置基準

        if (isImageLoaded) {
            let aspect = img.naturalWidth / img.naturalHeight;
            let drawW = drawH * aspect;
            yOffsetForText = drawH / 2;
            
            ctx.save();
            ctx.beginPath();
            // 繪製怪物陰影
            let shadowW = drawW * 0.4;
            let shadowH = drawW * 0.15;
            ctx.ellipse(this.x, this.y + drawH * 0.4, shadowW, shadowH, 0, 0, Math.PI * 2);
            ctx.fillStyle = this.stunTimer > 0 ? '#fbbf24' : '#000000'; // 暈眩時陰影變色
            ctx.globalAlpha = 0.5;
            ctx.fill();
            ctx.globalAlpha = 1.0;
            
            // 如果暈眩，可以考慮讓圖片變半透明或加特效，這裡簡單處理
            if(this.stunTimer > 0) ctx.globalAlpha = 0.7;
            
            // 套用旋轉踏步效果
            ctx.translate(this.x, this.y);
            ctx.rotate(gameState.stepAngle);
            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
            ctx.restore();
            
        } else {
            // 退回純色圓點
            ctx.fillStyle = this.stunTimer > 0 ? '#fbbf24' : this.color; 
            ctx.beginPath();
            let safeRadius = Math.max(1, this.size);
            ctx.arc(this.x, this.y, safeRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
        }

        if (this.isBoss) {
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${14 * gameScale}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText(this.name, this.x, this.y - yOffsetForText - 18 * gameScale);
        }

        if (this.stunTimer > 0) {
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${10 * gameScale}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('STUN', this.x, this.y - yOffsetForText - (this.isBoss ? 35 * gameScale : 14 * gameScale));
        }

        if (this.hp > 0) {
            let barW = 20 * gameScale * this.scaleMultiplier; 
            let barH = 4 * gameScale;
            let barY = this.y - yOffsetForText - 10 * gameScale;
            
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(this.x - barW/2, barY, barW, barH);
            ctx.fillStyle = '#22c55e';
            let hpWidth = barW * (this.hp / this.maxHp);
            ctx.fillRect(this.x - barW/2, barY, Math.max(0, hpWidth), barH);
        }
    }
}

function endGame(isWin) {
    gameState.isGameOver = true;
    const modal = document.getElementById('game-over-modal');
    modal.classList.remove('hidden');
    document.getElementById('game-over-title').innerText = isWin ? '任務成功！' : '任務失敗！';
    document.getElementById('game-over-title').classList.add(isWin ? 'text-yellow-400' : 'text-red-500');
    document.getElementById('game-over-desc').innerText = isWin ? '您成功守護了貓咪山脈！' : '怪物數量失控，防線崩潰！';
}

function gameLoop(timestamp) {
    if (!gameState.lastTime) gameState.lastTime = timestamp;
    const dt = (timestamp - gameState.lastTime) / 1000;
    gameState.lastTime = timestamp;

    // 計算踏步旋轉角度：週期1秒 (0.5秒正、0.5秒負)，振幅2度
    gameState.stepAngle = Math.sin(timestamp / 500 * Math.PI) * 2 * (Math.PI / 180);

    if (!gameState.isGameOver) {
        if (enemies.length > 50) endGame(false);

        if (gameState.phase !== 'MENU') {
            gameState.mpRegenTimer += dt;
            if (gameState.mpRegenTimer >= 1.0) {
                grids.forEach(g => {
                    g.units.forEach(u => {
                        let max = CHARACTERS[u.charName].maxMP;
                        if (u.mp < max) u.mp = Math.min(max, u.mp + 1);
                    });
                });
                gameState.mpRegenTimer = 0;
                if (selectedGrid) updateSidePanel(); 
            }

            gameState.passiveIncomeTimer += dt;
            if (gameState.passiveIncomeTimer >= 5) {
                gameState.gold += 5; gameState.passiveIncomeTimer = 0; updateUI();
            }

            gameState.phaseTimer -= dt;

            if (gameState.phase === 'ATTACK') {
                const isBossWave = (gameState.wave % 5 === 0);
                let actualBossCount = 0;
                if (isBossWave) {
                    if (gameState.difficulty === 'EASY') actualBossCount = 1;
                    else if (gameState.difficulty === 'NORMAL') actualBossCount = 2;
                    else if (gameState.difficulty === 'HARD') actualBossCount = 3;
                }

                let availableMonsters = Object.keys(MONSTERS).filter(name => MONSTERS[name].waves.includes(gameState.wave));

                gameState.spawnCooldown -= dt;
                if (gameState.spawnCooldown <= 0 && availableMonsters.length > 0) {
                    let randomMonsterName = availableMonsters[Math.floor(Math.random() * availableMonsters.length)];
                    
                    if (isBossWave && gameState.enemiesSpawnedThisWave < actualBossCount) {
                        enemies.push(new Enemy(randomMonsterName)); 
                        gameState.enemiesSpawnedThisWave++;
                        let remainingTime = Math.max(0.1, 15 - (30 - gameState.phaseTimer));
                        let avgWait = remainingTime / (actualBossCount - gameState.enemiesSpawnedThisWave + 1);
                        gameState.spawnCooldown = Math.random() * (avgWait * 2);
                    } else if (!isBossWave && gameState.enemiesSpawnedThisWave < gameState.baseEnemyCount) {
                        enemies.push(new Enemy(randomMonsterName)); 
                        gameState.enemiesSpawnedThisWave++;
                        let baseWait = Math.random() < 0.3 ? (Math.random() * 0.3 + 0.1) : (Math.random() * 1.5 + 1.0);
                        let scale = 20 / gameState.baseEnemyCount;
                        gameState.spawnCooldown = baseWait * scale;
                    }
                }
            }

            if (gameState.phaseTimer <= 0) {
                if (gameState.phase === 'ATTACK') {
                    if (gameState.wave >= 25) endGame(true); else startPhase('COOLDOWN');
                } else startPhase('ATTACK');
            }
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].update(dt);
            if (enemies[i].hp <= 0) {
                gameState.gold += enemies[i].reward;
                enemies.splice(i, 1); updateUI();
            }
        }

        // 塔攻擊與技能判定
        grids.forEach(grid => {
            if (grid.units.length > 0) {
                let charName = grid.units[0].charName;
                let charData = CHARACTERS[charName];
                let cx = grid.x + grid.size / 2;
                let cy = grid.y + grid.size / 2;
                
                // 等比例放大射程，確保在大地圖上能正常攻擊
                let actualRange = charData.range * gameScale; 

                grid.units.forEach(unit => {
                    // 扣減施法動畫計時器
                    if (unit.castTimer > 0) {
                        unit.castTimer = Math.max(0, unit.castTimer - dt);
                    }
                    
                    unit.cooldown -= dt;
                    if (unit.cooldown <= 0 && enemies.length > 0) {
                        let target = enemies.find(e => Math.hypot(e.x - cx, e.y - cy) <= actualRange);
                        if (target) {
                            let skillFired = false;
                            
                            if (charData.skills.length > 0) {
                                let skill = SKILLS[charData.skills[0]];
                                if (unit.mp >= skill.costMP) {
                                    if (Math.random() <= skill.rate) {
                                        skillFired = true;
                                        unit.mp -= skill.costMP;
                                        unit.castTimer = 0.6; // 設定施法動畫持續 0.6 秒
                                        
                                        if(selectedGrid === grid) updateSidePanel();
                                        
                                        if (skill.targetType === 'SINGLE') {
                                            projectiles.push({
                                                x: cx, y: cy, tx: target.x, ty: target.y,
                                                speed: 500, color: skill.color, damage: skill.magicDamage,
                                                target: target, isSkill: true, skillData: skill
                                            });
                                        } else if (skill.targetType === 'AOE') {
                                            let aoeTargets = enemies.filter(e => Math.hypot(e.x - cx, e.y - cy) <= actualRange);
                                            aoeTargets.forEach(t => {
                                                projectiles.push({
                                                    x: cx, y: cy, tx: t.x, ty: t.y,
                                                    speed: 500, color: skill.color, damage: skill.magicDamage,
                                                    target: t, isSkill: true, skillData: skill
                                                });
                                            });
                                        }
                                    }
                                }
                            }
                            
                            if (!skillFired) {
                                projectiles.push({
                                    x: cx, y: cy, tx: target.x, ty: target.y,
                                    speed: 400, color: RARITY_COLORS[charData.level], damage: charData.damage, target: target, isSkill: false
                                });
                            }
                            unit.cooldown = charData.cd; 
                        }
                    }
                });
            }
        });

        // 投射物判定
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            let dx = p.target.x - p.x;
            let dy = p.target.y - p.y;
            let dist = Math.hypot(dx, dy);
            
            if (!enemies.includes(p.target) || p.target.hp <= 0) {
                projectiles.splice(i, 1); continue;
            }

            let actualSpeed = p.speed * gameScale;

            if (dist < actualSpeed * dt) {
                p.target.hp -= p.damage;
                if (p.isSkill && p.skillData.type === 'DEBUFF') {
                    p.target.stunTimer = Math.max(p.target.stunTimer, p.skillData.duration);
                }
                projectiles.splice(i, 1);
            } else {
                p.x += (dx / dist) * actualSpeed * dt;
                p.y += (dy / dist) * actualSpeed * dt;
            }
        }
        
        if(gameState.phase !== 'MENU') updateUI();
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 繪製防禦陣地半透明底色，讓高地背景清楚展現
    let deployW = Math.max(0, 7 * (grids[0]?.size || 0)); 
    let deployH = Math.max(0, 4 * (grids[0]?.size || 0));
    if(grids.length > 0) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; 
        ctx.fillRect(grids[0].x, grids[0].y, deployW, deployH);
    }

    // 警告紅框 (40隻)
    if (enemies.length >= 40 && !gameState.isGameOver) {
        const alpha = (Math.sin(timestamp / 200) + 1) / 4 + 0.1; 
        ctx.strokeStyle = `rgba(239, 68, 68, ${alpha})`; ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
    }

    grids.forEach(grid => {
        // 僅在有選取角色時顯示高亮網格
        if (selectedGrid) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; 
            ctx.lineWidth = 1; 
            ctx.strokeRect(grid.x, grid.y, grid.size, grid.size);
        }

        if (grid === selectedGrid) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.fillRect(grid.x, grid.y, grid.size, grid.size);
            if (grid.units.length > 0) {
                let r = CHARACTERS[grid.units[0].charName].range * gameScale;
                ctx.beginPath(); ctx.arc(grid.x + grid.size/2, grid.y + grid.size/2, r, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)'; ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.stroke();
            }
        }

        if (grid.units.length > 0) {
            let charData = CHARACTERS[grid.units[0].charName];
            let count = grid.units.length;
            let cx = grid.x + grid.size / 2;
            let cy = grid.y + grid.size / 2;
            let color = RARITY_COLORS[charData.level];
            let img = charImages[grid.units[0].charName];
            
            let isImageLoaded = img && img.complete && img.naturalWidth > 0;
            
            let magicColor = '#ffffff';
            if (charData.skills.length > 0) magicColor = SKILLS[charData.skills[0]].color;

            let isSingleMax = charData.maxStack === 1;
            let baseDrawH = isSingleMax ? (grid.size * 0.95) : (grid.size * 0.65); 
            
            let yOffset = grid.size * 0.15;
            let xOffset = grid.size * 0.22;

            // 準備每個角色的繪製位置
            let positions = [];
            if (count === 1) {
                positions.push({x: cx, y: cy, u: grid.units[0]});
            } else if (count === 2) {
                positions.push({x: cx - xOffset, y: cy, u: grid.units[0]});
                positions.push({x: cx + xOffset, y: cy, u: grid.units[1]});
            } else if (count >= 3) {
                positions.push({x: cx, y: cy - yOffset, u: grid.units[0]}); 
                positions.push({x: cx - xOffset, y: cy + yOffset, u: grid.units[1]}); 
                positions.push({x: cx + xOffset, y: cy + yOffset, u: grid.units[2]}); 
            }

            positions.forEach(pos => {
                let u = pos.u;
                let isCasting = u.castTimer && u.castTimer > 0;
                let scaleMultiplier = 1.0; // 移除施法放大效果
                let drawH = baseDrawH * scaleMultiplier;
                
                if (isImageLoaded) {
                    let aspect = img.naturalWidth / img.naturalHeight;
                    let drawW = drawH * aspect;
                    
                    ctx.save();
                    ctx.beginPath();
                    // 陰影不隨施法放大，避免遮蔽網格
                    let shadowW = isSingleMax ? (baseDrawH * aspect) * 0.5 : (baseDrawH * aspect) * 0.4;
                    let shadowH = isSingleMax ? (baseDrawH * aspect) * 0.2 : (baseDrawH * aspect) * 0.15;
                    ctx.ellipse(pos.x, pos.y + baseDrawH * 0.4, shadowW, shadowH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.4;
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    
                    if (isCasting) {
                        let alpha = u.castTimer / 0.6; // 淡出計算
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(timestamp / 300); // 魔法陣旋轉
                        ctx.globalAlpha = alpha;
                        ctx.strokeStyle = magicColor;
                        ctx.lineWidth = 2 * gameScale;
                        ctx.shadowColor = magicColor;
                        ctx.shadowBlur = 10 * gameScale;
                        
                        let r = drawW * 0.6;
                        // 畫外圓與內圓
                        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, Math.PI * 2); ctx.stroke();
                        
                        // 畫五芒星
                        let pOrder = [0, 2, 4, 1, 3, 0];
                        ctx.beginPath();
                        pOrder.forEach((idx, step) => {
                            let angle = (idx * 2 * Math.PI / 5) - Math.PI / 2;
                            let px = Math.cos(angle) * r * 0.8;
                            let py = Math.sin(angle) * r * 0.8;
                            if (step === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        });
                        ctx.stroke();
                        ctx.restore();
                    }
                    
                    ctx.translate(pos.x, pos.y);
                    if (!isCasting) {
                        ctx.rotate(gameState.stepAngle);
                    }
                    
                    ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
                    ctx.restore();
                    
                } else {
                    let dotRadius = Math.max(6, grid.size * 0.16) * scaleMultiplier;
                    
                    if (isCasting) {
                        let alpha = u.castTimer / 0.6;
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(timestamp / 300);
                        ctx.globalAlpha = alpha;
                        ctx.strokeStyle = magicColor;
                        ctx.lineWidth = 2 * gameScale;
                        let r = dotRadius * 2.5;
                        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
                        let pOrder = [0, 2, 4, 1, 3, 0];
                        ctx.beginPath();
                        pOrder.forEach((idx, step) => {
                            let angle = (idx * 2 * Math.PI / 5) - Math.PI / 2;
                            let px = Math.cos(angle) * r;
                            let py = Math.sin(angle) * r;
                            if (step === 0) ctx.moveTo(px, py);
                            else ctx.lineTo(px, py);
                        });
                        ctx.stroke();
                        ctx.restore();
                    }

                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, dotRadius, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#374151'; 
                    ctx.stroke();
                }
            });
        }
    });

    enemies.forEach(e => e.draw(ctx));
    
    projectiles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        let pRadius = p.isSkill ? 6 : 4;
        ctx.arc(p.x, p.y, pRadius, 0, Math.PI * 2);
        ctx.fill();
        if(p.isSkill) {
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
        }
    });

    requestAnimationFrame(gameLoop);
}

// 確保腳本載入後啟動引擎
resizeAndLayout();
updateSidePanel();
window.onload = function() {
    requestAnimationFrame(gameLoop);
};

</script>
